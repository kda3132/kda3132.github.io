<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>検索くんProFinal</title>
<style>
/* ------------------------------------------------ */
/* PC/デフォルト表示スタイル */
/* ------------------------------------------------ */
body {
    font-family: sans-serif;
    padding: 10px;
    margin: 0;
    background: #f8f8f8;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

.main-content {
    flex: 1;
}

h1 { text-align: center; color: #333; }

.search-group {
    margin-bottom: 8px; 
    display: flex; 
    flex-direction: column; 
    align-items: center;
    padding: 5px 0;
}

.input-area { display: flex; width: 100%; max-width: 400px; }
input { padding: 6px; flex-grow: 1; margin-right: 5px; }
button { padding: 6px 12px; cursor: pointer; white-space: nowrap; }

#step2Container {
    display: none;
    margin-top: 20px;
    padding: 10px;
    background: #eee;
    border-radius: 6px; 
    max-width: 600px; 
    margin-left: auto; 
    margin-right: auto;
}
#step1Container { max-width: 600px; margin: 0 auto; }

.info-message { color: #555; text-align: center; }

/* 検索結果のdivのスタイル */
#resultsContainer > div {
    cursor: pointer;
    display: block; 
    width: 100%; 
    text-align: left;
    padding: 8px;
    margin-bottom: 4px;
    border: 1px solid #ccc;
    background-color: #fff;
    font-size: 1.1em;
}
#resultsContainer > div:hover {
    background-color: #dbeafe;
}

/* データ切り替えボタンのスタイル */
.data-switch-group button {
    margin: 5px;
    padding: 8px 15px;
    border: 1px solid #007bff;
    background-color: #f0f8ff;
    color: #007bff;
    border-radius: 4px;
}
.data-switch-group button.active {
    background-color: #007bff;
    color: white;
    font-weight: bold;
}

/* ------------------------------------------------ */
/* フッター & ログアウトボタン スタイル */
/* ------------------------------------------------ */
footer {
    margin-top: 30px;
    padding: 15px 10px;
    border-top: 1px solid #e0e0e0;
    text-align: center;
    background-color: #f8f8f8;
}

.footer-logout-container {
    margin-bottom: 8px;
}

/* 薄いグレー背景、黒文字のログアウトボタン */
.btn-logout {
    background-color: #e8e8e8;
    color: #333333;
    border: 1px solid #cccccc;
    padding: 6px 18px;
    font-size: 0.9em;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.2s, border-color 0.2s;
}

.btn-logout:hover {
    background-color: #d8d8d8;
    border-color: #bbb;
}

.footer-info {
    font-size: 75%;
    color: #666;
    margin: 0;
}
</style>
</head>
<body>

<div class="main-content">
    <h1>検索くんProFinal <span style="font-size: 65%; font-weight: normal;"> ver.1.00β</span></h1>
    <p id="sourceInfo" style="color: #555; margin-top: -10px; margin-bottom: 20px; text-align: center;">データ読込中...</p>

    <div style="text-align: center; margin-bottom: 20px;">
        <h3>データソース切り替え</h3>
        <div class="data-switch-group">
            <button id="switchData31" class="active">31所データに切り替え</button>
            <button id="switchData32">32所データに切り替え</button>
        </div>
    </div>

    <div id="step1Container">
        <h2>ステップ1: 冠称名検索</h2>
        <div class="search-group">
            <label for="nameInput">冠称名検索 (漢字):</label>
            <div class="input-area">
                <input type="text" id="nameInput" placeholder="例: 南">
                <button id="nameSearchBtn">検索</button>
            </div>
        </div>
        <div class="search-group">
            <label for="kanaInput">半角カナ検索:</label>
            <div class="input-area">
                <input type="text" id="kanaInput" placeholder="例: ﾐﾅﾐ">
                <button id="kanaSearchBtn">検索</button>
            </div>
        </div>
        <h3>検索候補一覧</h3>
        <div id="resultsContainer" class="info-message"></div>
    </div>

    <div id="step2Container">
        <h2>ステップ2: 地図検索</h2>
        <p>冠称名: <span id="selectedKanshomeiDisplay" style="font-weight: bold; color: #007bff;">---</span></p>
        <div class="search-group">
            <label for="denchuInput">電柱番号を入力してください（空欄の場合は冠称名全体を表示）:</label>
            <div class="input-area">
                <input type="text" id="denchuInput" placeholder="空欄で冠称名MAP / 例: 123, 71W2N2">
                <button id="mapSearchBtn" disabled>MAP検索</button>
            </div>
        </div>
        <p id="denchuFormatInfo" style="color:#008000;"></p>
        <p id="mapSearchResult" style="font-weight: bold; color: red;"></p>
        <button id="resetSearchBtn" style="margin-top: 15px;">冠称名検索に戻る</button>
    </div>
</div>

<footer>
    <!-- 1行目中央: 薄グレー背景/黒文字のログアウトボタン -->
    <div class="footer-logout-container">
        <button id="logoutBtn" onclick="google.script.run.withSuccessHandler(() => location.reload()).logout()" class="btn-logout">ログアウト</button>
    </div>
    <!-- 2行目中央: クレジット ＆ アカウント数 -->
    <p class="footer-info">
        <span id="accountCountDisplay">登録アカウント数: <?= accountCount ?></span> | <span>(C) T.Okada 2026</span>
    </p>
</footer>

<script>
// --- バックエンド(GAS/サーバー)から渡されるデータ(前バージョンの変数・形式を保持) ---
// テンプレート評価時エラーを防ぐため、JSON stringify形式で受け取るか空値でフォールバックします
let kanshomeiData = [];
let latlngData = {};

try {
  kanshomeiData = JSON.parse('<?= JSON.stringify(kanshomeiData || []) ?>');
  latlngData = JSON.parse('<?= JSON.stringify(latlngData || {}) ?>');
} catch(e) {
  console.warn('[INIT] サーバー変数の初期化をスキップしました (ローカル実行またはデータ未定義)');
}

let selectedKanshomei = null;
let selectedKansyoMapUrl = null;
let currentJigyosho = '31所';

// --- UI要素の取得 ---
const sourceInfo = document.getElementById("sourceInfo");
const nameInput = document.getElementById('nameInput');
const kanaInput = document.getElementById('kanaInput');
const resultsContainer = document.getElementById('resultsContainer');
const step1Container = document.getElementById('step1Container');
const step2Container = document.getElementById('step2Container');
const selectedKanshomeiDisplay = document.getElementById('selectedKanshomeiDisplay');
const denchuInput = document.getElementById('denchuInput');
const mapSearchBtn = document.getElementById('mapSearchBtn');
const denchuFormatInfo = document.getElementById('denchuFormatInfo');
const mapSearchResult = document.getElementById('mapSearchResult');
const switchBtn31 = document.getElementById('switchData31');
const switchBtn32 = document.getElementById('switchData32');

// --- ユーティリティ関数 ---

/** 全角英数字を半角英数字に変換するユーティリティ関数 */
const toHalfWidth = (str) => {
    return str.replace(/[Ａ-Ｚａ-ｚ０-９]/g, (s) => {
        return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
    }).replace(/[\u3099\u309A]/g, ''); 
};

/** 電柱枝番を検索キー形式に正規化する関数 */
const convertCode = (inputStr) => {
    if (!inputStr) {
        return { error: true, message: "電柱枝番の入力が空です" };
    }
    
    let str = toHalfWidth(inputStr); 
    str = str.toUpperCase().replace(/[-\s]/g, '');

    const robustRegex = /^(\d{1,3})(([A-Z]\d{1,2})*)$/; 
    const matches = str.match(robustRegex);

    if (!matches) {
        console.error(`[SEARCH] 正規化失敗: 入力 "${inputStr}" (半角化後: "${str}")`);
        return { error: true, message: "枝番の形式が不正です (例: 123, 71W2N2, 58G2W3)" };
    }

    const mainCode = matches[1].padStart(3, '0');
    const allBranches = matches[2] || "";

    let finalCode = mainCode;
    const branch1Regex = /([A-Z])(\d{1,2})/; 
    const branch1Match = allBranches.match(branch1Regex);

    if (branch1Match) {
        const char1 = branch1Match[1];
        const num1 = branch1Match[2].padStart(2, '0');
        const branch1Processed = char1 + num1;
        
        const remainingBranches = allBranches.substring(branch1Match[0].length);
        
        finalCode += branch1Processed;
        finalCode += remainingBranches;
    }
    console.log(`[SEARCH] 正規化成功: 元入力 "${inputStr}" -> 最終コード "${finalCode}"`);
    return { error: false, code: finalCode };
};

// --- データロード/切替処理（バックエンドGAS連携） ---

function loadData(jigyosho) {
    currentJigyosho = jigyosho;
    sourceInfo.textContent = `データ読込中: 「${jigyosho}」...`;
    mapSearchBtn.disabled = true;
    
    resetSearchState();
    switchBtn31.classList.toggle('active', jigyosho === '31所');
    switchBtn32.classList.toggle('active', jigyosho === '32所');

    console.log(`[FETCH] サーバー側データ読み込み呼び出し: ${jigyosho}`);
    
    // GASバックエンドの getData 関数を呼び出し
    google.script.run
        .withSuccessHandler((data) => {
            kanshomeiData = data.kansyo;
            latlngData = data.latlng;
            sourceInfo.textContent = `データ取得完了: 「${jigyosho}」 冠称名 ${kanshomeiData.length}件`;
            console.log(`[FETCH] データ取得成功 (${jigyosho})`);
            if (step2Container.style.display === "block") {
                mapSearchBtn.disabled = false;
            }
        })
        .withFailureHandler((e) => {
            console.error(`[FETCH] データロードエラー (${jigyosho}):`, e);
            sourceInfo.textContent = `エラー: データが取得できませんでした (${e.message})`;
        })
        .getData(jigyosho);
}

// --- ステップ1: 冠称名検索処理 ---

const displayResults = (results) => {
    resultsContainer.innerHTML = "";
    if (results.length === 0) {
        resultsContainer.innerHTML = '<p class="info-message">一致する冠称名はありませんでした。</p>';
        return;
    }

    results.forEach(item => {
        const linkDiv = document.createElement("div"); 
        linkDiv.textContent = `${item.冠称名} (${item.カナ})`;
        
        linkDiv.addEventListener("click", () => { 
            selectedKanshomei = item.冠称名;
            selectedKansyoMapUrl = item.map || item.MAP || null;

            console.log(`[JS] ステップ2へ移行。選択冠称名: ${selectedKanshomei}, MAP URL: ${selectedKansyoMapUrl}`);

            selectedKanshomeiDisplay.textContent = selectedKanshomei;
            step1Container.style.display = "none";
            step2Container.style.display = "block";
            
            denchuInput.value = ""; 
            mapSearchResult.textContent = ""; 
            denchuFormatInfo.textContent = "";
            
            mapSearchBtn.disabled = false;
            denchuInput.focus();
        });
        resultsContainer.appendChild(linkDiv);
    });
};

const searchK = (query, key) => {
    if (!query) {
        displayResults([]);
        return;
    }
    const normalized = (key === "カナ") ? query.toUpperCase() : query;
    const results = kanshomeiData.filter(item =>
        item[key] && item[key].includes(normalized)
    );
    displayResults(results);
};

// --- ステップ2: 地図検索処理 ---

const performMapSearch = () => {
    mapSearchResult.textContent = ""; 
    denchuFormatInfo.textContent = ""; 

    if (!selectedKanshomei) {
        mapSearchResult.textContent = "冠称名が選択されていません。";
        return;
    }

    const rawInput = denchuInput.value.trim();

    if (rawInput === "") {
        console.log(`[SEARCH] 電柱番号空欄のため、冠称名全体MAPを表示します: ${selectedKanshomei}`);
        
        if (selectedKansyoMapUrl) {
            window.open(selectedKansyoMapUrl, '_blank');
            mapSearchResult.textContent = `冠称名「${selectedKanshomei}」の全体地図を表示しました。`;
        } else {
            mapSearchResult.textContent = `冠称名「${selectedKanshomei}」の全体地図URLが定義されていません。`;
            console.warn(`[SEARCH] ${selectedKanshomei} に map URLが存在しません。`);
        }
        return;
    }

    console.log(`[SEARCH] 電柱ピンポイント検索実行: ${selectedKanshomei} - ${rawInput}`);

    if (!latlngData || Object.keys(latlngData).length === 0) {
        mapSearchResult.textContent = "エラー: 電柱データがロードされていません。";
        return;
    }

    const conv = convertCode(rawInput); 

    if (conv.error) {
        mapSearchResult.textContent = conv.message;
        denchuFormatInfo.textContent = "（エラー）";
        return; 
    }
    
    const key = `${selectedKanshomei} ${conv.code}`; 
    denchuFormatInfo.textContent = `正規化コード: ${conv.code}`;
    
    const latlng = latlngData[key];
    
    if (latlng) {
        mapSearchResult.textContent = `緯度経度: ${latlng}`;
        const mapsUrl = "https://maps.google.com/?q=" + latlng; 
        window.open(mapsUrl, '_blank');
        
        denchuInput.value = ""; 
        denchuInput.focus();
    } else {
        mapSearchResult.textContent = `"${key}" に一致するデータが見つかりません。`;
    } 
}; 

// --- 状態リセット関数 ---
function resetSearchState() {
    step1Container.style.display = "block";
    step2Container.style.display = "none";
    selectedKanshomei = null; 
    selectedKansyoMapUrl = null;
    denchuInput.value = ""; 
    mapSearchResult.textContent = ""; 
    denchuFormatInfo.textContent = "";
    resultsContainer.innerHTML = ""; 
    nameInput.value = "";
    kanaInput.value = "";
    kanaInput.focus();
}

// --- 初期化とイベントリスナー設定 ---

document.addEventListener('DOMContentLoaded', () => {
    console.log(`[INIT] アプリ起動: ${new Date().toLocaleTimeString()}`);
    
    // 初期表示設定
    sourceInfo.textContent = `データロード完了: 「${currentJigyosho}」 冠称名 ${kanshomeiData.length}件`;

    // データ切り替えボタン
    switchBtn31.addEventListener('click', () => loadData('31所'));
    switchBtn32.addEventListener('click', () => loadData('32所'));

    // ステップ1検索イベント
    const nameSearchBtn = document.getElementById('nameSearchBtn');
    const kanaSearchBtn = document.getElementById('kanaSearchBtn');

    nameSearchBtn.addEventListener('click', () => searchK(nameInput.value, '冠称名'));
    nameInput.addEventListener('keypress', e => { if (e.key === 'Enter') searchK(nameInput.value, '冠称名'); });
    kanaSearchBtn.addEventListener('click', () => searchK(kanaInput.value, 'カナ'));
    kanaInput.addEventListener('keypress', e => { if (e.key === 'Enter') searchK(kanaInput.value, 'カナ'); });
    
    // ステップ2検索/リセットイベント
    mapSearchBtn.addEventListener('click', performMapSearch);
    denchuInput.addEventListener('keypress', e => { if (e.key === 'Enter') performMapSearch(); });
    
    const resetSearchBtn = document.getElementById('resetSearchBtn');
    resetSearchBtn.addEventListener('click', () => resetSearchState());
});
</script>
</body>
</html>
